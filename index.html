<!DOCTYPE html>
<html>
<head>
  <title>Face Tracking - MindAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    
    /* Start Button Overlay */
    #overlay {
      position: absolute;
      z-index: 999;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #startBtn {
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: #ff0055;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    }

    /* Message for user */
    #status {
      color: white;
      margin-top: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <button id="startBtn">START</button>
    <div id="status">Tap to start camera & video</div>
  </div>

  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="vid" src="man_dancing.mp4" playsinline webkit-playsinline loop muted crossorigin="anonymous"></video>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 1">
      
      <a-plane 
        src="#vid" 
        position="0 0 0" 
        height="1" 
        width="0.8" 
        rotation="0 0 0"
        material="transparent: true; opacity: 1;">
      </a-plane>
      
    </a-entity>

  </a-scene>

  <script>
    const startBtn = document.getElementById('startBtn');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('status');
    const videoAsset = document.querySelector('#vid');
    const scene = document.querySelector('a-scene');

    startBtn.addEventListener('click', () => {
      statusText.innerText = "Initializing...";
      
      // 1. Unmute and Play video immediately on user interaction
      // This is the "Magic Key" for iOS/Android
      videoAsset.play().then(() => {
        console.log("Video playing...");
      }).catch(e => {
        console.error("Video play failed:", e);
        statusText.innerText = "Error: " + e.message;
      });

      // 2. Hide Overlay
      overlay.style.display = 'none';
      
      // 3. The AR scene is already running, but now the video texture is active
    });

    // Optional: Log when AR is ready
    scene.addEventListener("arReady", (event) => {
      console.log("MindAR is ready");
    });
    
    scene.addEventListener("arError", (event) => {
      console.log("MindAR failed to start");
      statusText.innerText = "Camera Access Denied";
      overlay.style.display = 'flex';
    });
  </script>

</body>
</html>
