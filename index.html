<!DOCTYPE html>
<html>
<head>
  <title>Face Filter - Mobile Stable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    /* 1. LOCK THE VIEWPORT */
    /* This prevents the "Zoom" when address bar hides */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed; /* Crucial for iOS */
      background-color: black;
    }

    #overlay {
      position: absolute; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    #startBtn {
      padding: 20px 60px;
      font-size: 20px;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 50px;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Hide the raw video, but keep it in the DOM */
    #content-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    // 2. TEXTURE FORCE UPDATE
    // This component forces A-Frame to redraw the video 60 times a second
    AFRAME.registerComponent('video-texture-fix', {
      init: function () {
        this.video = document.querySelector('#content-video');
      },
      tick: function () {
        // If video is playing, force the texture to update
        if (this.video.readyState >= 2) {
          const mesh = this.el.getObject3D('mesh');
          if (mesh && mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        }
      }
    });
  </script>
</head>
<body>

  <div id="overlay">
    <button id="startBtn">START FILTER</button>
  </div>

  <video id="content-video" loop muted playsinline webkit-playsinline crossOrigin="anonymous">
    <source src="man_dancing.mp4" type="video/mp4">
  </video>

  <a-scene 
    mindar-face 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights, logarithmicDepthBuffer: true"
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 1">
      
      <a-plane 
        video-texture-fix
        src="#content-video" 
        position="0 0 0" 
        height="1.5" 
        width="1" 
        rotation="0 0 0"
        material="shader: flat; transparent: true; opacity: 1; alphaTest: 0.5">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const startBtn = document.getElementById('startBtn');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('content-video');

    startBtn.addEventListener('click', async () => {
      // 1. Play the video FIRST (User Interaction Requirement)
      try {
        await video.play();
        console.log("Video started");
        
        // 2. Hide overlay only after video starts
        overlay.style.display = 'none';
      } catch (err) {
        alert("Video Error: " + err.message);
      }
    });
  </script>
</body>
</html>
